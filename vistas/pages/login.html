<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/pages/login.css">
    <link rel="stylesheet" href="../css/global/style.css">
</head>
<body>
    <div class="back-button"><a href="../index.html">Volver</a></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Bienvenido</h1>
                <p class="login-subtitle">Inicia sesión en tu cuenta</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="admin"
                        required
                    >
                </div>

                <div class="form-group password-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">
                            <img src="../img/png/see.png" alt="Ver" class="eye-icon">
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="register.html" class="register-link">Regístrate aquí</a></p>
            </div>

            <div id="alert-success" class="alert alert-success">
                ¡Inicio de sesión exitoso! Redirigiendo...
            </div>
            <div id="alert-error" class="alert alert-error">
                Credenciales incorrectas. Inténtalo de nuevo.
            </div>
            
        </div>
    </div>

<script src="../js/modules/login.js"></script>
</body>
</html>
