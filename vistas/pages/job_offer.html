<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ofertas de Trabajo - CUL</title>
    <link rel="stylesheet" href="../css/global/style.css">
    <link rel="stylesheet" href="../css/global/dashboard.css">
    <link rel="stylesheet" href="../css/components/crud-tabs.css">
    <!-- Componentes nuevos -->
    <link rel="stylesheet" href="../css/components/confirmation-modal.css">
    <link rel="stylesheet" href="../css/components/loading-spinner.css">
    <link rel="stylesheet" href="../css/components/toast-notification.css">
    <!-- DataTable Styles -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../css/components/datatable-custom.css">
</head>
<body>
<script src="../js/shared/session-validator.js"></script>
    
    <app-sidebar></app-sidebar>

    <div class="main">
        <app-header title="Panel de Ofertas de Trabajo"></app-header>
        <div class="content">
            <!-- BOTONES DE ACCIÓN CRUD -->
            <crud-actions-bar></crud-actions-bar>
            <!-- CREAR -->
            <div id="Crear_Oferta" class="crud-section">
                <h3>Publicar Nueva Vacante</h3>
                <form id="CrearJobOffer">
                    <label>Cargo:</label>
                    <input type="text" id="position_c" required><br>
                    <label>Empresa:</label>
                    <input type="text" id="company_c" required><br>
                    <label>Salario:</label>
                    <input type="number" step="0.01" id="salary_c" required><br>
                    <label>Tipo de Contrato (ID):</label>
                    <input type="number" id="id_type_c" required><br>
                    <label>Área:</label>
                    <input type="text" id="area_c" required><br>
                    <label>Correo de Contacto:</label>
                    <input type="text" id="email_contact_c" required><br>
                    <label>Fecha de la Oferta:</label>
                    <input type="date" id="offer_date_c" required><br>
                    <label>ID Programa:</label>
                    <input type="number" id="id_program_c" required><br>
                    
                    <button id="btn_crear" type="submit">Guardar Oferta</button>
                </form>
                <div id="mensaje"></div>
            </div>

            <!-- VER TODOS -->
            <div id="ver_todos_ofertas" class="crud-section">
                <p>Cargando ofertas...</p>
            </div>

            <!-- BUSCAR -->
            <div id="Buscar_Oferta" class="crud-section">
                <h3>Buscar Oferta de Trabajo</h3>
                <form id="form_buscar">
                    <label>Buscar por ID:</label>
                    <input type="number" id="id_search" required>
                    <button type="submit">Buscar</button>
                </form>
                <div id="oferta">
                    <p>Cargando oferta...</p>
                </div>
            </div>

            <!-- EDITAR -->
            <div id="Editar_Oferta" class="crud-section">
                <h3>Editar Oferta de Trabajo</h3>
                <form id="editarJobOffer">
                    <label>ID:</label>
                    <input type="number" id="id_edit" required><br>
                    <label>Cargo:</label>
                    <input type="text" id="position_e" required><br>
                    <label>Empresa:</label>
                    <input type="text" id="company_e" required><br>
                    <label>Salario:</label>
                    <input type="number" step="0.01" id="salary_e" required><br>
                    <label>Tipo de Contrato (ID):</label>
                    <input type="number" id="id_type_e" required><br>
                    <label>Área:</label>
                    <input type="text" id="area_e" required><br>
                    <label>Correo de Contacto:</label>
                    <input type="text" id="email_contact_e" required><br>
                    <label>Fecha de la Oferta:</label>
                    <input type="date" id="offer_date_e" required><br>
                    <label>ID Programa:</label>
                    <input type="number" id="id_program_e" required><br>
                    <label>Activa:</label>
                    <select id="active_e">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select><br><br>
                    <button id="btn_editar" type="submit">Guardar Cambios</button>
                </form>
            </div>

            <!-- ELIMINAR -->
            <div id="Eliminar_Oferta" class="crud-section">
                <h3>Eliminar Oferta de Trabajo</h3>
                <form>
                    <label>Eliminar por ID:</label>
                    <input type="number" id="id_delete" required>
                    <button type="submit">Eliminar</button>
                </form>
            </div>
        </div><!-- fin content -->
    </div><!-- fin main -->
    <!-- jQuery (Requerido para DataTable) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTable Scripts -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script src="../js/shared/api-interceptor.js"></script>
    <script src="../js/shared/access-control.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/app-header.js"></script>
    <script src="../js/components/logout.js"></script>
    <script src="../js/components/confirmation-modal.js"></script>
    <script src="../js/components/loading-spinner.js"></script>
    <script src="../js/components/toast-notification.js"></script>
    <script src="../js/components/user-button.js"></script>
    <script src="../js/components/crud-tabs-manager.js"></script>
    <script src="../js/components/curd-actions-bar.js"></script>
    <script src="../js/components/datatable-initializer.js"></script>
    <script src="../js/modules/job_offer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../js/shared/email-notifier.js"></script>
    
</body>
</html>
