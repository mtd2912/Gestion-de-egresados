<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programas Académicos - CUL</title>
    <link rel="stylesheet" href="../css/global/style.css">
    <link rel="stylesheet" href="../css/global/dashboard.css">
    <link rel="stylesheet" href="../css/components/crud-tabs.css">
    <!-- Componentes -->
    <link rel="stylesheet" href="../css/components/confirmation-modal.css"> 
    <link rel="stylesheet" href="../css/components/loading-spinner.css">
    <link rel="stylesheet" href="../css/components/toast-notification.css">
    <!-- DataTable Styles -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../css/components/datatable-custom.css">
</head>
<body>
<script src="../js/shared/session-validator.js"></script>
    <app-sidebar></app-sidebar>

    <div class="main">
        <app-header title="Panel de Programas"></app-header>
        <div class="content">
            <!-- BOTONES DE ACCIÓN CRUD -->
            <crud-actions-bar></crud-actions-bar>
            <!-- CREAR -->
            <div id="Crear_Program" class="crud-section">
                <h3>Publicar Nuevo Programa</h3>
                <form id="form_crear_pg">
                    <label>Nombre del Programa:</label>
                    <input type="text" id="program_name_C" placeholder="Ej: Ingeniería en Sistemas" required>

                    <label>ID Facultad:</label>
                    <input type="number" id="faculty_C" placeholder="Ej: 1" required>

                    <button type="submit">Crear Programa</button>
                </form>
            </div>

            <!-- VER TODOS -->
            <div id="get_all_Programs" class="crud-section">
                <h3>Lista de Programas</h3>
                <p>Cargando programas...</p>
            </div>

            <!-- BUSCAR -->
            <div id="buscar_Program" class="crud-section">
                <h3>Buscar Programa</h3>
                <form id="form_buscar">
                    <label>Buscar por ID:</label>
                    <input type="number" id="id_search" placeholder="Ej: 1" required>
                    <button type="submit">Buscar</button>
                </form>
                <div id="resultado_busqueda">
                    <p>Aquí aparecerá el resultado...</p>
                </div>
            </div>

            <!-- EDITAR -->
            <div id="editar_Program" class="crud-section">
                <h3>Editar Programa</h3>
                <form id="form_editar_pg">
                    <label>ID Programa (Fijo):</label>
                    <input type="number" id="id_edit" readonly required>

                    <label>Nombre del Programa:</label>
                    <input type="text" id="program_name_E" placeholder="Ej: Ingeniería en Sistemas" required>

                    <label>ID Facultad:</label>
                    <input type="number" id="faculty_E" placeholder="Ej: 1" required>

                    <label>Activo:</label>
                    <select id="active_E" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>

                    <button id="btn_editar" type="submit">Guardar Cambios</button>
                </form>
            </div>

            <!-- ELIMINAR -->
            <div id="Eliminar_Program" class="crud-section">
                <h3>Eliminar Programa</h3>
                <form id="form_eliminar">
                    <label>ID a eliminar:</label>
                    <input type="number" id="id_delete" placeholder="Ej: 1" required>
                    <button type="submit">Eliminar</button>
                </form>
            </div>

        </div><!-- fin content -->
    </div><!-- fin main -->
    <!-- jQuery (Requerido para DataTable) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTable Scripts -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script src="../js/shared/api-interceptor.js"></script>
    <script src="../js/shared/access-control.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/app-header.js"></script>
    <script src="../js/components/logout.js"></script>
    <script src="../js/components/confirmation-modal.js"></script>
    <script src="../js/components/loading-spinner.js"></script>
    <script src="../js/components/toast-notification.js"></script>
    <script src="../js/components/user-button.js"></script>
    <script src="../js/components/crud-tabs-manager.js"></script>
    <script src="../js/components/curd-actions-bar.js"></script>
    <script src="../js/components/datatable-initializer.js"></script>
    <script src="../js/modules/programa.js"></script>

</body>
</html>
