<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleos - CUL</title>
    <link rel="stylesheet" href="../css/global/style.css">
    <link rel="stylesheet" href="../css/global/dashboard.css">
    <link rel="stylesheet" href="../css/components/crud-tabs.css">
    <!-- Componentes nuevos -->
    <link rel="stylesheet" href="../css/components/confirmation-modal.css">
    <link rel="stylesheet" href="../css/components/loading-spinner.css">
    <link rel="stylesheet" href="../css/components/toast-notification.css">
    <!-- DataTable Styles -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../css/components/datatable-custom.css">
</head>
<body>
<script src="../js/shared/session-validator.js"></script>
    <app-sidebar></app-sidebar>
    <div class="main">
        <app-header title="Panel de Empleos"></app-header>
        <div class="content">
            <!-- BOTONES DE ACCIÓN CRUD -->
            <crud-actions-bar></crud-actions-bar>
            <!-- CREAR -->
            <div id="Crear_Job" class="crud-section">
                <h3>Registrar Nuevo Empleo</h3>
                <form id="form_crear_job">
                    <label>ID Graduado:</label> 
                    <input type="number" id="id_graduate_C" required><br>

                    <label>Empresa:</label> 
                    <input type="text" id="company_C" required><br>

                    <label>ID Sector:</label> 
                    <input type="number" id="id_sector_C" required><br>

                    <label>Cargo (Position):</label> 
                    <input type="text" id="position_C" required><br>

                    <label>Salario:</label> 
                    <input type="number" step="0.01" id="salary_C" required><br>

                    <label>Fecha de Inicio:</label> 
                    <input type="date" id="start_date_C" required><br>

                    <label>Fecha de Fin:</label> 
                    <input type="date" id="end_date_C"><br>

                    <label>ID Tipo de Contrato:</label> 
                    <input type="number" id="id_type_C" required><br>

                    <label>¿Relacionado a su carrera?</label>
                    <select id="related_to_career_C">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select><br>

                    <button type="submit">Registrar Empleo</button>
                </form>
            </div>

            <!-- VER TODOS -->
            <div id="get_all_Jobs" class="crud-section">
                <h3>Lista General de Empleos</h3>
                <p>Cargando empleos registrados...</p>
            </div>

            <!-- BUSCAR -->
            <div id="buscar_Job" class="crud-section">
                <h3>Buscar por ID de Empleo</h3>
                <form id="form_buscar">
                    <input type="number" id="id_search" placeholder="Ingrese ID" required>
                    <button type="submit">Buscar</button>
                </form>
                <div id="resultado_busqueda">
                    <p>El resultado aparecerá aquí...</p>
                </div>
            </div>

            <!-- EDITAR -->
            <div id="editar_Job" class="crud-section">
                <h3>Editar Información Laboral</h3>
                <form id="form_editar_j">
                    <label>ID Empleo (Fijo):</label>
                    <input type="number" id="id_edit" required><br>

                    <label>ID Graduado:</label>
                    <input type="number" id="id_graduate_E" required><br>

                    <label>Empresa:</label>
                    <input type="text" id="company_E" required><br>

                    <label>ID Sector:</label>
                    <input type="number" id="id_sector_E" required><br>

                    <label>Cargo:</label>
                    <input type="text" id="position_E" required><br>

                    <label>Salario:</label>
                    <input type="number" step="0.01" id="salary_E" required><br>

                    <label>Fecha Inicio:</label>
                    <input type="date" id="start_date_E" required><br>

                    <label>Fecha Fin:</label>
                    <input type="date" id="end_date_E"><br>

                    <label>ID Tipo:</label>
                    <input type="number" id="id_type_E" required><br>

                    <label>Relacionado:</label>
                    <select id="related_to_career_E">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select><br>

                    <label>Activo:</label>
                    <select id="active_E">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select><br>

                    <button type="submit">Guardar Cambios</button>
                </form>
            </div>

            <!-- ELIMINAR -->
            <div id="Eliminar_Job" class="crud-section">
                <h3>Eliminar Empleo</h3>
                <form id="form_eliminar">
                    <label>ID a eliminar:</label>
                    <input type="number" id="id_delete" required>
                    <button type="submit">Eliminar</button>
                </form>
            </div>
        </div><!-- fin content -->
    </div><!-- fin main -->
    <!-- jQuery (Requerido para DataTable) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTable Scripts -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script src="../js/shared/api-interceptor.js"></script>
    <script src="../js/shared/access-control.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/app-header.js"></script>
    <script src="../js/components/logout.js"></script>
    <script src="../js/components/confirmation-modal.js"></script>
    <script src="../js/components/loading-spinner.js"></script>
    <script src="../js/components/toast-notification.js"></script>
    <script src="../js/components/user-button.js"></script>
    <script src="../js/components/crud-tabs-manager.js"></script>
    <script src="../js/components/curd-actions-bar.js"></script>
    <script src="../js/components/datatable-initializer.js"></script>
    <script src="../js/modules/jobs.js"></script>
</body>
</html>
