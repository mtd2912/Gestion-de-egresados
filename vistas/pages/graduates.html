<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Graduados - CUL</title>
    <link rel="stylesheet" href="../css/global/style.css">
    <link rel="stylesheet" href="../css/global/dashboard.css">
    <link rel="stylesheet" href="../css/components/crud-tabs.css">
    <!-- Componentes -->
    <link rel="stylesheet" href="../css/components/confirmation-modal.css">
    <link rel="stylesheet" href="../css/components/loading-spinner.css">
    <link rel="stylesheet" href="../css/components/toast-notification.css">

    <!-- DataTable Styles -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../css/components/datatable-custom.css">
</head>
<body>
<script src="../js/shared/session-validator.js"></script>
    <app-sidebar></app-sidebar>
    <div class="main">
        <app-header title="Panel de Egresados"></app-header>
        <div class="content">
            <!-- BOTONES DE ACCIÓN CRUD -->
            <crud-actions-bar></crud-actions-bar>
            <!-- CREAR -->
            <div id="Crear_Graduate" class="crud-section">
                <h3>Registrar Nuevo Graduado</h3>
                <form id="form_crear_graduate">
                    <label>Nombres:</label><br>
                    <input type="text" id="first_name_C" required><br>

                    <label>Apellidos:</label><br>
                    <input type="text" id="last_name_C" required><br>

                    <label>Email:</label> <br>
                    <input type="email" id="email_C" required><br>

                    <label>Teléfono:</label> <br>
                    <input type="text" id="phone_C" required><br>

                    <label>Fecha de Nacimiento:</label> <br>
                    <input type="date" id="birth_date_C" required><br>

                    <label>Año de Graduación:</label> <br>
                    <input type="number" id="graduation_year_C" min="1950" max="2050" required><br>

                    <label>ID Nivel Académico:</label> 
                    <input type="number" id="id_level_C" required><br>

                    <label>ID Estado:</label> 
                    <input type="number" id="id_status_C" required><br>

                    <label>ID Programa:</label> 
                    <input type="number" id="id_program_C" required><br><br>

                    <button type="submit">Registrar Graduado</button>
                </form>
            </div>

            <!-- VER TODOS -->
            <div id="get_all_Graduates" class="crud-section">
                <h3>Lista General de Graduados</h3>
                <p>Cargando graduados...</p>
            </div>

            <!-- BUSCAR -->
            <div id="buscar_Graduate" class="crud-section">
                <h3>Buscar por ID</h3>
                <form id="form_buscar">
                    <input type="number" id="id_search" placeholder="Ingrese ID" required>
                    <button type="submit">Buscar</button>
                </form>
                <div id="resultado_busqueda">
                    <p>El resultado aparecerá aquí...</p>
                </div>
            </div>

            <!-- EDITAR -->
            <div id="editar_Graduate" class="crud-section">
                <h3>Editar Información de Graduado</h3>
                <form id="form_editar_g">
                    <label>ID Graduado (Fijo):</label>
                    <input type="number" id="id_edit" required><br>

                    <label>Nombres:</label>
                    <input type="text" id="first_name_E" required><br>

                    <label>Apellidos:</label>
                    <input type="text" id="last_name_E" required><br>

                    <label>Email:</label><br>
                    <input type="email" id="email_E" required><br>

                    <label>Teléfono:</label><br>
                    <input type="text" id="phone_E" required><br>

                    <label>Fecha de Nacimiento:</label>
                    <input type="date" id="birth_date_E" required><br>

                    <label>Año de Graduación:</label>
                    <input type="number" id="graduation_year_E" required><br>

                    <label>ID Nivel:</label><br>
                    <input type="number" id="id_level_E" required><br>

                    <label>ID Estado:</label>
                    <input type="number" id="id_status_E" required><br>

                    <label>ID Programa:</label>
                    <input type="number" id="id_program_E" required><br>

                    <label>Estado Activo:</label><br>
                    <select id="active_E">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select><br>

                    <button type="submit">Guardar Cambios</button>
                </form>
            </div>

            <!-- ELIMINAR -->
            <div id="Eliminar_Graduate" class="crud-section">
                <h3>Eliminar Graduado</h3>
                <form id="form_eliminar">
                    <label>ID a eliminar:</label><br>
                    <input type="number" id="id_delete" required>
                    <button type="submit">Eliminar de la Base de Datos</button>
                </form>
            </div>
        </div><!-- fin content -->
    </div><!-- fin main -->
    <!-- jQuery (Requerido para DataTable) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTable Scripts -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script src="../js/shared/api-interceptor.js"></script>
    <script src="../js/shared/access-control.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/app-header.js"></script>
    <script src="../js/components/logout.js"></script>
    <script src="../js/components/confirmation-modal.js"></script>
    <script src="../js/components/loading-spinner.js"></script>
    <script src="../js/components/toast-notification.js"></script>
    <script src="../js/components/user-button.js"></script>
    <script src="../js/components/crud-tabs-manager.js"></script>
    <script src="../js/components/curd-actions-bar.js"></script>
    <script src="../js/components/datatable-initializer.js"></script>
    <script src="../js/modules/graduates.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../js/shared/email-notifier.js"></script>

</body>
</html>
